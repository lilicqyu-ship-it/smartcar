name: CI

# Compile gate + firmware size / resource-margin report.
# - firmware: full ESP-IDF v6.1 build (sdkconfig.defaults, so the checked-in
#   configuration is what gets gated), then scripts/ci_size_report.py prints
#   flash/RAM usage with free-margin percentages into the job summary and
#   fails the build past the size gates.
# - host-tests: G1 protocol gate, no target needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: esp-idf build + size gates
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (ESP-IDF v6.1, esp32s3)
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Firmware size & resource margins
        run: |
          python scripts/ci_size_report.py \
            --map build/smartcar_remote.map \
            --bin build/smartcar_remote.bin \
            --partitions partitions.csv

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/smartcar_remote.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error

  host-tests:
    name: host proto tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run proto tests
        run: make -C test/host check
