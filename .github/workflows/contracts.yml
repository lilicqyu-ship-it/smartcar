# 契约门禁：四工程的共享接口副本必须与 contracts/ 逐字节一致
# monorepo：无需再拉 submodule；不加 paths 过滤——副本被单方面改坏同样要在这里拦下
name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Windows 也跑一遍：保证脚本在 Git Bash 下可用、换行规则在两平台一致
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: check contracts
        run: bash scripts/check-contracts.sh
