# Release (esp32c6_car): push c6/vX.Y.Z tag → 生产口味构建 → GitHub Release。
# 产物: app 镜像、控制页资源、单文件合并镜像；release notes 取 tag 注释（git tag -a -m）。
# tag 带工程前缀（c6/），产物文件名里用剥掉前缀的版本号（避免文件名含 "/"）。
name: Release (esp32c6_car)

on:
  push:
    tags: ["c6/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32c6_car
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag checkout + git describe for PROJECT_VER

      - name: Derive version from tag
        run: echo "VER=${GITHUB_REF_NAME#c6/}" >> "$GITHUB_ENV"

      - name: Cache ESP-IDF v6.1-beta1 and toolchain
        id: idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: idf-v6.1-beta1-esp32c6

      - name: Install ESP-IDF v6.1-beta1 (esp32c6 target only)
        if: steps.idf.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v6.1-beta1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh esp32c6

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - name: Merge one-file flash image
        run: |
          . ~/esp-idf/export.sh
          python -m esptool --chip esp32c6 merge-bin \
            -o "build/esp32c6_car_${VER}_merged.bin" \
            --flash-mode dio --flash-size 8MB --flash-freq 40m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x19000 build/ota_data_initial.bin \
            0x20000 build/esp32c6_car.bin

      - name: Release notes from tag annotation
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32c6_car/build/esp32c6_car.bin
            esp32c6_car/build/assets.bin
            esp32c6_car/build/esp32c6_car_${{ env.VER }}_merged.bin
          body_path: esp32c6_car/release_notes.md
