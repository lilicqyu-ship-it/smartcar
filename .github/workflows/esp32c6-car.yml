# CI (esp32c6_car): host 单测 + 固件构建（sdkconfig.defaults，生产口味）
# （本机 sdkconfig 是台架口味故意不入库——CI 是生产口味的门禁；发版也出自同一 defaults）
# 大小门禁: app <= 90% OTA 槽位、静态 DIRAM <= 95%、extra images 必须装进各自分区
# （tools/ci_size_report.py，与 smartcar_remote 同款）。
# monorepo: working-directory 指向 esp32c6_car/；contracts/ 变更同样触发（接口副本的源头）。
name: CI (esp32c6_car)

on:
  push:
    branches: [main]
    paths: ["esp32c6_car/**", "contracts/**"]
  pull_request:
    paths: ["esp32c6_car/**", "contracts/**"]
  workflow_dispatch:

concurrency:
  group: esp32c6-car-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32c6_car
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: make -C test/host check

  firmware:
    name: Firmware build + size gates (IDF v6.1-beta1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32c6_car
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # PROJECT_VER 由 git describe 提供

      - name: Cache ESP-IDF v6.1-beta1 and toolchain
        id: idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: idf-v6.1-beta1-esp32c6

      - name: Install ESP-IDF v6.1-beta1 (esp32c6 target only)
        if: steps.idf.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v6.1-beta1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh esp32c6

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - name: Firmware size & resource margins
        run: |
          . ~/esp-idf/export.sh
          python tools/ci_size_report.py \
            --map build/esp32c6_car.map \
            --bin build/esp32c6_car.bin \
            --partitions partitions.csv \
            --extra-bin assets=build/assets.bin

      - name: Report
        run: |
          echo "version: $(git describe --tags --dirty)"
          ls -la build/esp32c6_car.bin build/assets.bin
