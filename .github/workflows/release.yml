name: Release

# Tag-driven release. Pushing vX.Y.Z re-runs the host tests first, then
# creates the GitHub Release with generated notes. Per the repo's version
# convention (see the v0.2.0 release notes), the 0.x series is pre-production
# and is published with the prerelease flag; v1.0.0+ publish as full releases.
#
# Firmware binaries are intentionally NOT attached: the TASKING build is
# IDE-based and cannot run on hosted runners. Build from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Host tests before publish
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARGS=(--verify-tag --title "$TAG")
          case "$TAG" in
            v0.*) ARGS+=(--prerelease --latest=false) ;;
            *)    ARGS+=(--latest) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${ARGS[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes "${ARGS[@]}"
          fi
