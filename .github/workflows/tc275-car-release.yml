name: Release (tc275_car)

# Tag 驱动发版。push app/vX.Y.Z 先跑 host 单测，再创建 GitHub Release
# （自动生成 notes）。版本约定（见 v0.2.0 release notes）: 0.x 系列为
# 预生产，带 prerelease 标志发布; v1.0.0+ 为正式发布。
#
# 刻意不附固件二进制: TASKING 构建走 IDE，托管 runner 上无法运行。请从 tag 自行构建。
on:
  push:
    tags: ['app/v*']

permissions:
  contents: read

jobs:
  test:
    name: Host tests before publish
    uses: ./.github/workflows/tc275-car.yml

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Create or update the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARGS=(--verify-tag --title "$TAG")
          case "$TAG" in
            app/v0.*) ARGS+=(--prerelease --latest=false) ;;
            *)        ARGS+=(--latest) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${ARGS[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes "${ARGS[@]}"
          fi
