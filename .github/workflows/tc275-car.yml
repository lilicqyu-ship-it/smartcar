name: CI (tc275_car)

# Host 侧验证。TASKING 固件编译无法在托管 runner 上进行（专有编译器），
# CI 覆盖 gcc 能证明的部分: SF 帧编解码、38 字节遥测布局对 C6 侧解码器的
# 交叉校验、电池 VIN 换算链（bsp/adc.h 纯函数）、xcore 命令队列/日志环
# 纪律（FIFO/容量/SET_SPEED 新者胜塌缩/日志非阻塞字节泵）、链路时序图的
# JSON 源。
# monorepo: esp32c6_car 就在仓内——遥测交叉校验直接编译仓内 C6 源码，
# 跨工程字节布局是"编译期锁定"而非复制（doc 22 E13/R12）；C6 侧契约变更
# 必须在这里炸 CI，而不是在台架上。
on:
  push:
    branches: [main]
    paths:
      - "tc275_car/**"
      - "esp32c6_car/components/c6_proto/**"
      - "esp32c6_car/components/c6_sf/**"
      - "contracts/**"
      - "esp32c6_car/components/c6_bridge/**"
  pull_request:
    paths:
      - "tc275_car/**"
      - "esp32c6_car/components/c6_proto/**"
      - "esp32c6_car/components/c6_sf/**"
      - "contracts/**"
      - "esp32c6_car/components/c6_bridge/**"
  workflow_dispatch:
  workflow_call:   # 被 tc275-car-release.yml 复用，tag 无法带未测代码上线

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (gcc, ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tc275_car
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SF frame codec tests
        run: |
          mkdir -p test/host/out
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I . \
              test/host/test_sf.c mw/sf/sf_frame.c mw/calib/calib_record.c \
              -o test/host/out/test_sf
          test/host/out/test_sf

      - name: Telemetry layout tests (C6 decoder cross-check)
        run: |
          gcc -std=c99 -Wall -Wextra -O2 -DC6_CROSS_CHECK -I . \
              -I ../esp32c6_car/components/c6_proto -I ../esp32c6_car/components/c6_sf \
              test/host/test_sf_telemetry.c mw/sf/sf_telemetry.c \
              mw/sf/sf_frame.c ../esp32c6_car/components/c6_proto/proto_frames.c \
              -o test/host/out/test_sf_telemetry
          test/host/out/test_sf_telemetry

      - name: Sensor fusion and manual driving guard scenarios
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I . \
              test/host/test_fusion.c app/fusion.c -lm -o test/host/out/test_fusion
          test/host/out/test_fusion

      - name: Diagnostic transaction lifecycle and sensor integrity
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I . \
              test/host/test_diag_txn.c app/diag_txn.c mw/sf/sf_frame.c \
              -o test/host/out/test_diag_txn
          test/host/out/test_diag_txn
          python3 test/host/test_diag_link.py
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I test/host/stub -I . \
              test/host/test_diag_service.c app/diag_txn.c -o test/host/out/test_diag_service
          test/host/out/test_diag_service

      - name: ToF I2C request ordering and recovery model
        run: |
          python3 test/host/test_tof_bus.py
          python3 test/host/test_tof_stream.py
          python3 test/host/test_fusion_bridge.py

      - name: Developer log rate and format policy model
        run: python3 test/host/test_log_policy.py

      - name: ADC battery conversion tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I . -I test/host/stub \
              test/host/test_adc.c -o test/host/out/test_adc
          test/host/out/test_adc

      - name: IMU conversion tests (LSM6DSV16BX, bsp/imu.h pure helpers)
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I . -I test/host/stub \
              test/host/test_imu.c -o test/host/out/test_imu
          test/host/out/test_imu

      - name: xcore command queue / log ring discipline tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I test/host/stub -I . \
              test/host/test_xcore.c mw/xcore/xcore.c \
              -o test/host/out/test_xcore
          test/host/out/test_xcore

      - name: Calibration persistence scheduler tests (mocked hardware)
        run: python3 test/host/test_calib_store.py

      - name: Sequence diagram source is valid JSON
        run: python3 -m json.tool doc/20-design/link-c6.sequence.json > /dev/null
