<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f2e9">
<title>SmartDrive 控制台</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body class="drive-page">
<header>
  <img class="logo" src="/logo.svg" alt="">
  <div class="brand">
    <b id="ssid">SmartDrive</b>
    <span id="ver">--</span>
  </div>
  <div class="hstat">
    <span class="pill" id="role_pill"><b id="role_txt">--</b></span>
    <span class="pill"><span class="dot" id="dot_tc"></span>车端</span>
    <span class="pill"><span class="dot" id="dot_ws"></span>链路</span>
    <span class="pill" id="batt_pill">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="2" y="8" width="17" height="9" rx="2.5"/>
        <path d="M22 11v3" stroke-linecap="round"/>
        <rect x="4.5" y="10.5" width="9" height="4" rx="1" fill="currentColor" stroke="none"/>
      </svg>
      <b id="batt_pct">--</b><span id="batt_v"></span>
    </span>
  </div>
</header>
<main>
  <div class="page-heading"><div><span class="eyebrow">C6 / DRIVE WORKSPACE</span><h1>掌控每一次前进<span>。</span></h1><p>连接车辆，轻推摇杆，即刻出发。</p></div><a class="tool-link" href="/calib.html">台架标定 ↗</a></div>
  <div class="workspace">
  <section class="card" id="panel" aria-label="车辆实时仪表">
    <div class="section-heading"><span class="eyebrow">01 / LIVE TELEMETRY</span><span class="live-caption">实时车况</span></div>
    <div class="gauge">
      <label>左轮</label>
      <div class="bar bar-t"><div id="bar_lt"></div></div>
      <div class="bar bar-m"><div id="bar_lm"></div></div>
      <div class="readout"><span id="v_lt">0</span><small>mm/s</small></div>
      <label class="gauge-sub">目标 · 实测</label>
    </div>
    <div id="speedo">
      <span class="speed-label">当前车速</span>
      <div class="speed-dial"><div id="speed_val">--</div>
      <div id="speed_unit">km/h</div>
      <div id="speed_dir">&nbsp;</div>
      </div>
      <div id="state" class="state" data-tone="dim">未连接</div>
    </div>
    <div class="gauge">
      <label>右轮</label>
      <div class="bar bar-t"><div id="bar_rt"></div></div>
      <div class="bar bar-m"><div id="bar_rm"></div></div>
      <div class="readout"><span id="v_rt">0</span><small>mm/s</small></div>
      <label class="gauge-sub">目标 · 实测</label>
    </div>
  </section>
  <section class="card joy-card" aria-label="驾驶操控">
    <div class="section-heading"><span class="eyebrow">02 / DRIVE CONTROL</span><span class="live-caption">手动驾驶</span></div>
    <div class="control-heading"><h2>方向，由你。</h2><p id="control_hint">正在连接设备…</p></div>
    <div id="joy" aria-label="拖动驾驶摇杆，松手停止" aria-describedby="control_hint">
      <span class="guide" aria-hidden="true"></span>
      <span class="arr n" aria-hidden="true">前进</span>
      <span class="arr s" aria-hidden="true">倒车</span>
      <span class="arr w" aria-hidden="true">左</span>
      <span class="arr e" aria-hidden="true">右</span>
      <div id="knob"></div>
    </div>
    <div class="row ctl">
      <button id="btn_stop" class="danger">■ 停止</button>
      <button id="btn_pair">连接 / 配对</button>
    </div>
    <p class="gesture-note">按住拖动 · 松手归零</p>
    <div class="row stats">
      <span class="chip">里程 <b id="odo">0</b> m</span>
      <span class="chip" id="rtt">rtt --</span>
    </div>
  </section>
  </div>
  <section class="card" id="maint">
    <details>
      <summary>03 / 设备维护与固件升级</summary>
      <div class="mrow">
        <label class="file"><input type="file" id="file_c6" accept=".bin"><span id="lbl_c6">选择 C6 固件 (.bin)</span></label>
        <button id="btn_ota_c6">升级 C6</button>
      </div>
      <div class="mrow">
        <label class="file"><input type="file" id="file_tc" accept=".bin"><span id="lbl_tc">选择 TC275 固件 (.bin)</span></label>
        <button id="btn_ota_tc">升级 TC275</button>
      </div>
      <div class="ota-bar"><div id="ota_bar"></div></div>
      <div id="ota_progress" role="status"></div>
      <div class="mrow link"><a href="/diag">链路诊断 ↗</a></div>
      <div class="mrow link"><a href="/calib.html">台架标定 ↗</a></div>
    </details>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
