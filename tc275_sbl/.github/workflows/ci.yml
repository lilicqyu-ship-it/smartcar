name: CI

# Host-side verification only. The TASKING firmware build cannot run on
# hosted runners (proprietary compiler), so CI covers what gcc can prove:
# the OTA boot state machine, OtaMeta double-page metadata, OTA RX protocol
# and the TCFW bundle format (test/host `make check`; test_vectors.h is
# committed, so no sibling checkout is needed).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (gcc, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tc275_sbl
        uses: actions/checkout@v4

      # CC=gcc overrides the Makefile's bench-specific default (msys64 path).
      - name: OTA host unit tests
        run: make -C test/host check CC=gcc
